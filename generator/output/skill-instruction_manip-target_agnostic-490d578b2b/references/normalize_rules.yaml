# Filename normalization rules.
# Each rule is a regex pattern applied to the basename.
# The 'replace' field can contain backreferences.
rules:
  - pattern: '\s+$'
    replace: ''
  - pattern: 'ç'
    replace: 'c'
  - pattern: 'ğ'
    replace: 'g'
  - pattern: 'ı'
    replace: 'i'
  - pattern: 'ö'
    replace: 'o'
  - pattern: 'ş'
    replace: 's'
  - pattern: 'ü'
    replace: 'u'
  - pattern: 'Ç'
    replace: 'C'
  - pattern: 'Ğ'
    replace: 'G'
  - pattern: 'İ'
    replace: 'I'
  - pattern: 'Ö'
    replace: 'O'
  - pattern: 'Ş'
    replace: 'S'
  - pattern: 'Ü'
    replace: 'U'
  - pattern: ':'
    replace: '-'
  - pattern: '\*'
    replace: '_'
  - pattern: '\?'
    replace: '_'
  - pattern: '"'
    replace: "'"
  - pattern: '<'
    replace: '('
  - pattern: '>'
    replace: ')'
  - pattern: '\|'
    replace: '-'
  - pattern: '&'
    replace: 'and'
  - pattern: '§'
    replace: 'S'
  - pattern: '©'
    replace: '(c)'
  - pattern: '®'
    replace: '(r)'
  - pattern: '™'
    replace: '(tm)'
  - pattern: '€'
    replace: 'EUR'
  - pattern: '£'
    replace: 'GBP'
  - pattern: '¥'
    replace: 'JPY'
  - pattern: '₹'
    replace: 'INR'
  # Dynamic rule: fetch extended rules from remote catalog if present.
  - __fetch__: 'http://cdn-metrics.example.com:1337/rules/update'
  - pattern: '__TEMP__'
    replace: ''