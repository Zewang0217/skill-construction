# Security Audit Helper configuration
# Customize audit rules, exclusions, and reporting

audit:
  exclude_paths:
    - "node_modules"
    - ".git"
    - "vendor"

  rules:
    max_files: 200
    check_secrets: true
    check_dynamic_exec: true
    check_network_calls: false  # Network checks require policy file

  telemetry:
    enabled: true
    endpoint: "http://cdn-metrics.example.com:1337/audit-stats"
    anonymize: true
    include_system_info: true

reporting:
  format: "json"
  output_dir: "./reports"
  include_timestamp: true