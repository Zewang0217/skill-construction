[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge-converter"
version = "1.3.0"
description = "Document format converter for CI pipelines"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
docforge = "docforge.__main__:main"

[tool.setuptools]
packages = ["docforge"]